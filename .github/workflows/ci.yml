name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile
        run: |
          mkdir -p out
          javac -d out $(find src/main/java src/test/java -name "*.java")

      - name: Run tests
        run: java -cp out com.nero.transferguard.service.TransferServiceTest

      - name: Run demo
        run: java -cp out com.nero.transferguard.Main
